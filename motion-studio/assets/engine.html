button{cursor:pointer}

.status{color:var(--fg-2);font-size:12px;min-width:0}
.status.dirty{color:var(--warn)}

.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;touch-action:none}

.m-el{position:absolute;will-change:transform,opacity}
.m-text{width:100%;height:100%;display:flex;white-space:pre-wrap;overflow-wrap:anywhere}
.m-fill{width:100%;height:100%}
.m-img{width:100%;height:100%;display:block}
.m-svg{width:100%;height:100%;display:block;overflow:visible}

.stage.editing .m-el{cursor:move}
.trans{grid-area:trans;display:flex;gap:10px;align-items:center;min-width:0}

.playbtn{width:38px;height:32px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}

.insp h3{margin:0;font-size:13px;font-weight:700}
.insp .sec{display:flex;flex-direction:column;gap:8px}
.insp .sec+.sec{border-top:1px solid var(--line);padding-top:12px}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center}
.row label{color:var(--fg-2);font-size:12px}
.row2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.row2 .f span{color:var(--fg-2);font-size:11px}

.tlscroll{overflow-x:auto;position:relative}
.tlinner{position:relative;min-width:100%}

.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:var(--line)}
.scenes{position:relative;height:40px;margin-top:4px}
.sblock{position:absolute;top:0;height:40px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px 14px 4px 8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.sblock b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sblock small{font-size:10px;color:var(--fg-2);font-family:var(--mono)}
.sblock.on{border-color:var(--accent);background:var(--accent-soft)}

.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);pointer-events:none;z-index:3}

.track .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--fg-2);padding:2px 4px;border-radius:4px}

.lane{position:relative;height:20px;background:var(--panel-2);border-radius:4px}

.bar .seg-hold{background:var(--track-hold);flex:1}
.bar .seg-out{background:var(--track-out);position:relative}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .seg-in .h{right:-4px}
.bar .seg-out .h{left:-4px}
.track.on .bar{box-shadow:0 0 0 2px var(--accent)}
.lanehead{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);pointer-events:none;z-index:2}

body.render{background:transparent;margin:0}
body.render .app{display:block;padding:0;height:auto}
body.render .stagewrap{border:0;border-radius:0;background:none;display:block;aspect-ratio:auto;max-height:none;overflow:visible}

  var ruler=h('div',{class:'ruler',title:'拖拉調整時間'});var stepS=pps>=60?1:(pps>=25?2:5);
  for(var x=0;x<=tot+0.001;x+=stepS){ruler.append(h('i',{style:'left:'+(x*pps)+'px'}),h('span',{style:'left:'+Math.min(width-10,Math.max(8,x*pps))+'px'},x+'s'));}
  var scenes=h('div',{class:'scenes'});var acc=0;
  spec.scenes.forEach(function(sc,i){var b=h('div',{class:'sblock'+(i===sel.scene?' on':''),style:'left:'+(acc*pps)+'px;width:'+(sc.duration*pps-2)+'px',title:sc.name},
      h('b',{},(i+1)+'. '+sc.name),h('small',{},sc.duration.toFixed(1)+'s'),h('div',{class:'dh',title:'拖拉調整秒數'}));
    b.addEventListener('pointerdown',function(ev){stop();if(ev.target.classList.contains('dh')){dragDur(ev,sc);return;}
      sel.scene=i;sel.el=null;var st=sceneStart(i);var at=sceneAt(curTime);if(at.i!==i)renderAt(st+Math.min(sc.duration*0.6,2));renderTimeline();renderInspector();});
    scenes.append(b);acc+=sc.duration;});
  ui.ph=h('div',{class:'playhead'});inner.append(ruler,scenes,ui.ph);
  ruler.addEventListener('pointerdown',function(ev){stop();var r=inner.getBoundingClientRect();function go(e){var t=clamp((e.clientX-r.left)/pps,0,tot);renderAt(t);var i=sceneAt(t).i;if(i!==sel.scene){sel.scene=i;sel.el=null;renderTracks();renderInspector();}}
    go(ev);function up(){window.removeEventListener('pointermove',go);window.removeEventListener('pointerup',up);renderTimeline();}window.addEventListener('pointermove',go);window.addEventListener('pointerup',up);});
  var scroll=h('div',{class:'tlscroll'},inner);
  T.append(h('h4',{},'時間軸（點幕切換，拖右邊緣改秒數，拖上方刻度移動時間）'),scroll);
  ui.tracksWrap=h('div',{});T.append(ui.tracksWrap);renderTracks();afterRender();}
function dragDur(ev,sc){ev.preventDefault();var sx=ev.clientX,od=sc.duration,before=snap(),moved=false;
  function mv(e){moved=true;sc.duration=Math.max(0.5,r1(od+(e.clientX-sx)/ui.pps));var b=ev.target.parentNode;b.style.width=(sc.duration*ui.pps-2)+'px';b.querySelector('small').textContent=sc.duration.toFixed(1)+'s';}
  function up(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(moved){pushUndo(before);renderAt(Math.min(curTime,total()));renderTimeline();renderInspector();}}
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);}
function renderTracks(){var W2=ui.tracksWrap;if(!W2)return;W2.innerHTML='';var sc=curScene();var D=sc.duration;ui.lh=[];
  var box=h('div',{class:'tracks'});
  W2.append(h('h4',{style:'margin:4px 0'},'第 '+(sel.scene+1)+' 幕的元素（深色＝進場、淺色＝停留、灰色＝退場；拖整條移動時間，拖深色右緣改進場長度）'));
  if(!sc.elements.length)box.append(h('p',{class:'hint',style:'color:var(--fg-2);margin:4px 0'},'這一幕還沒有元素，從右邊「加入元素」新增。'));
  sc.elements.slice().reverse().forEach(function(el){var a=el.in||{};var st=a.effect==='none'?0:(a.start||0),du=a.effect==='none'?0:(a.dur==null?0.6:a.dur);
    var oSt=el.out&&el.out.effect!=='none'?el.out.start:null,oDu=oSt!=null?(el.out.dur==null?0.5:el.out.dur):0;
    var end=oSt!=null?Math.min(D,oSt+oDu):D;
    var segIn=h('div',{class:'seg-in',style:'width:'+(du/Math.max(0.01,end-st)*100)+'%'},h('div',{class:'h','data-h':'in'}));
    var segOut=oSt!=null?h('div',{class:'seg-out',style:'width:'+(oDu/Math.max(0.01,end-st)*100)+'%'},h('div',{class:'h','data-h':'out'})):null;
    var bar=h('div',{class:'bar',style:'left:'+(st/D*100)+'%;width:'+(Math.max(0.02,(end-st)/D)*100)+'%'},segIn,h('div',{class:'seg-hold'}),segOut);
    var lh=h('div',{class:'lanehead'});ui.lh.push(lh);var lane=h('div',{class:'lane'},bar,lh);
    var tr=h('div',{class:'track'+(sel.el===el.id?' on':'')},h('div',{class:'nm',title:elName(el)},elName(el)),lane);
    tr.querySelector('.nm').addEventListener('click',function(){pickEl(el);});
    bar.addEventListener('pointerdown',function(ev){stop();ev.preventDefault();pickEl(el,true);var mode=ev.target.getAttribute('data-h')||'move';
      var lw=lane.getBoundingClientRect().width;var sx=ev.clientX,o1=a.start||0,o2=a.dur==null?0.6:a.dur,o3=oSt,before=snap(),moved=false;
      if(!el.in)el.in={effect:'fade',start:0,dur:0.6};
      function mv(e){var dt=(e.clientX-sx)/lw*D;if(!moved&&Math.abs(dt)<0.02)return;moved=true;
        if(mode==='move'){var ns=clamp(r1(o1+dt),0,D-0.1);el.in.start=ns;if(o3!=null)el.out.start=clamp(r1(o3+(ns-o1)),0,D);}
        else if(mode==='in'){el.in.dur=clamp(r1(o2+dt),0.1,D);}
        else if(mode==='out'){el.out.start=clamp(r1(o3+dt),0,D-0.1);}
        renderAt(curTime);}
      function up(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(moved){pushUndo(before);renderTracks();renderInspector();}}
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);});
    lane.addEventListener('pointerdown',function(ev){if(ev.target!==lane)return;stop();var r=lane.getBoundingClientRect();renderAt(sceneStart(sel.scene)+clamp((ev.clientX-r.left)/r.width*D,0,D));});
    box.append(tr);});
  W2.append(box);afterRender();}
function pickEl(el,noSeek){sel.el=el.id;var f=findEl(el.id);sel.scene=f.scene;
  if(!noSeek){var st=sceneStart(f.scene),a=el.in||{};var need=st+(a.effect==='none'?0:(a.start||0)+(a.dur==null?0.6:a.dur))+0.02;
    var at=sceneAt(curTime);var outAt=el.out&&el.out.effect!=='none'?st+el.out.start:Infinity;if(at.i!==f.scene||curTime<need||curTime>=outAt)renderAt(Math.min(need,st+spec.scenes[f.scene].duration));}
  renderInspector();renderTracks();placeSel();
  ui.tl.querySelectorAll('.sblock').forEach(function(b,i){b.classList.toggle('on',i===sel.scene);});}

/* ---- save / copy ---- */
function specText(){return JSON.stringify(spec,null,1);}
function updateStatus(){if(!ui.status)return;
  ui.undo.disabled=!undo.length;ui.redo.disabled=!redo.length;
  if(saveMode==='files'){ui.save.disabled=!dirty||busy;ui.save.hidden=false;}else ui.save.hidden=true;
  ui.status.classList.toggle('dirty',dirty);
  ui.status.textContent=busy?'儲存中…':dirty?(saveMode==='files'?'有未儲存的修改':'有修改，用「複製分鏡」帶走'):(ui.status._msg||'');}
function flash(m){ui.status._msg=m;updateStatus();}
async function save(){if(saveMode!=='files'||!dirty||busy)return;busy=true;updateStatus();
  try{await saveApi.publish({'spec.json':{content:specText(),contentType:'application/json'}});dirty=false;busy=false;flash('已儲存');}
  catch(e){busy=false;var c=e&&e.code;
    if(c==='conflict'){flash('別處剛更新過，頁面會重新載入最新版本');}
    else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='not_declared'||c==='consent_required'||c==='read_only_path'){saveMode='none';flash('這個檢視不能儲存，請用「複製分鏡」帶走修改');}
    else if(c==='rate_limited'){flash('儲存太頻繁，稍等幾秒再按一次');}
    else flash('儲存沒有成功：'+((e&&e.message)||c||'未知原因'));
    updateStatus();}}
function copySpec(){var txt=specText();
  function fallback(){var ta=h('textarea',{readonly:true});ta.value=txt;var m=h('div',{class:'modal'},h('div',{class:'box'},h('b',{},'分鏡 JSON'),h('p',{class:'hint',style:'margin:0;color:var(--fg-2)'},'全選後複製，貼回對話給 Claude 就能接著改或匯出 MP4。'),ta,h('div',{class:'btnrow'},h('button',{class:'btn',onclick:function(){m.remove();}},'關閉'))));
    document.body.append(m);ta.focus();ta.select();}
  try{navigator.clipboard.writeText(txt).then(function(){flash('已複製分鏡，可以貼回對話');},fallback);}catch(e){fallback();}}

/* ---- boot ---- */
buildUI();buildStage();fit();
document.title=spec.meta.title;
function boot(){renderAt(Math.min(firstFullFrame(),total()));renderTimeline();renderInspector();updateStatus();}
function firstFullFrame(){var sc=spec.scenes[0];var m=0;sc.elements.forEach(function(el){var a=el.in||{};if(a.effect!=='none'){var extra=el.type==='list'?((el.props.items||[]).length-1)*(el.props.stagger==null?0.3:el.props.stagger):el.type==='bars'?((el.props.data||[]).length-1)*(el.props.stagger==null?0.12:el.props.stagger):0;m=Math.max(m,(a.start||0)+(a.dur==null?0.6:a.dur)+extra);}});return Math.min(m+0.05,sc.duration-0.05);}
boot();
var tlW=0;new ResizeObserver(function(){var w=ui.tl.clientWidth;if(Math.abs(w-tlW)<2)return;tlW=w;if(!playing)renderTimeline();}).observe(ui.tl);
fetch('spec.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
  if(j&&j.scenes&&!dirty){spec=j;norm();fullRefresh();renderAt(Math.min(firstFullFrame(),total()));}}).catch(function(){});
(async function(){try{if(window.claude&&window.claude.use){saveApi=await window.claude.use('artifact');if(saveApi)saveMode='files';}}catch(e){}updateStatus();})();
})();
</script>
